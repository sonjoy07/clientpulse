upstream clientpulse_api {
    server api:4000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.clientpulse.example.com _;

    # ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.clientpulse.example.com;

    # SSL Configuration (TLSv1.2 & TLSv1.3 only)
    ssl_certificate /etc/letsencrypt/live/api.clientpulse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.clientpulse.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (6 months)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Proxy Buffer & Timeout Configuration
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    client_max_body_size 10m;

    # Default proxy header mappings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # 1. Health check endpoints (no rate limiting, bypass auth)
    location ~ ^/api/v1/health(/.*)?$ {
        proxy_pass http://clientpulse_api;
        access_log off;
    }

    # 2. Authentication endpoints (Strict Rate Limiting: 5 req/s with burst of 10)
    location ~ ^/api/v1/auth/(login|refresh)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://clientpulse_api;
    }

    # 3. AI Report generation endpoints (Strict Rate Limiting: 2 req/s with burst of 4)
    location ~ ^/api/v1/projects/[^/]+/ai-reports$ {
        limit_req zone=ai_limit burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://clientpulse_api;
    }

    # 4. General API routes (General Rate Limiting: 30 req/s with burst of 50)
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://clientpulse_api;
    }
}
