# ==============================================================================
# ClientPulse — Render Infrastructure-as-Code Blueprint (100% Free Tier)
# Architecture: NestJS API + Built-in Background Processor (Unified Web Service)
# Database: Supabase PostgreSQL (via DATABASE_URL & DIRECT_URL)
# Cache / Queue: Upstash Redis (Free Serverless) or Managed Redis
# ==============================================================================
services:
  # 1. ClientPulse REST API Web Service & Background Worker
  - type: web
    name: clientpulse-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: FRONTEND_URL
        sync: false
