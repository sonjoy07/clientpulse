# ==============================================================================
# ClientPulse — Render Infrastructure-as-Code Blueprint
# Architecture:
#   1. Web Service: NestJS REST API (port 10000, public HTTPS)
#   2. Background Worker: BullMQ Worker (processes AI reports & queues)
# Database: Render PostgreSQL (or Supabase via DATABASE_URL & DIRECT_URL)
# Queue / Cache: Render Redis (or Upstash via REDIS_URL)
# ==============================================================================
services:
  # 1. ClientPulse REST API Web Service
  - type: web
    name: clientpulse-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REDIS_URL
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: FRONTEND_URL
        sync: false

  # 2. ClientPulse BullMQ Background Worker
  - type: worker
    name: clientpulse-worker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
